name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            os: ubuntu-22.04
          - python: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 阅读器/package-lock.json
      - run: npm ci
        working-directory: 阅读器
      - run: npm test
        working-directory: 阅读器
      - run: python scripts/check_public.py
      - run: git diff --check
